<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrugInfo Chatbot</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>DrugInfo Assistant</h1>
        <p>Search medicines, dosage, side effects and medical information</p>
    </header>

    <main>

        <!-- Search Section -->
        <section class="search-section">

            <input 
                type="text" 
                id="drugInput" 
                placeholder="Search medicine name..."
            >

            <button onclick="searchDrug()">
                Search
            </button>

        </section>

        <!-- Drug Result -->
        <section class="result-section" id="resultSection">

            <h2 id="drugName">Drug Name</h2>

            <div class="card">
                <h3>Dosage</h3>
                <p id="dosageText">
                    Dosage information will appear here.
                </p>
            </div>

            <div class="card">
                <h3>Side Effects</h3>
                <p id="sideEffectsText">
                    Side effects will appear here.
                </p>
            </div>

            <div class="card">
                <h3>Drug Information</h3>
                <p id="infoText">
                    Drug information will appear here.
                </p>
            </div>

        </section>

    </main>

    <!-- Dialogflow Chatbot -->
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

    <df-messenger
        intent="WELCOME"
        chat-title="DrugInfoBot"
        agent-id="YOUR_AGENT_ID"
        language-code="en">
    </df-messenger>

    <script src="script.js"></script>

</body>
</html>
